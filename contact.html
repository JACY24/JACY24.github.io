<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="icon" type="image/x-icon" href="/images/internet_icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <input type="search" id="search-input" placeholder="Search..." aria-label="Search the site">
      <ul id="search-results" hidden></ul>
    </form>
  </header>

  <main>
    <h1>Contact</h1>
    <!-- GitHub Pages is static, so a form service handles delivery.
         Create a free form at https://formspree.io and replace YOUR_FORM_ID below. -->
    <form action="https://formspree.io/f/xaenrrbq" method="POST">
      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>

      <button type="submit">Send</button>
    </form>
  </main>

  <footer>&copy; 2026 My Website</footer>
  <script src="script.js"></script>
</body>
</html>
